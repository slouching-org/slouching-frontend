[package]
name = "slouching-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "x11", "wayland", "image", "svg", "canvas", "tokio"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
async-stream = "0.3"
prost = "=0.14.4"
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect"] }

image_codec = { package = "image", version = "=0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
prost-build = "=0.14.4"
