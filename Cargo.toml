[package]
name = "slouching-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "x11", "wayland", "image", "svg", "canvas", "tokio"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "=0.1.92"
futures-util = "0.3"
async-stream = "0.3"
prost = "=0.14.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect"] }
bytes = "=1.12.1"
hex = "=0.4.3"

image_codec = { package = "image", version = "=0.25.10", default-features = false, features = ["png"] }
directories = "=6.0.0"
blake3 = "=1.8.7"
mdns-sd = "=0.21.5"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"] }
keyring = "=4.2.0"
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
openmls = { version = "=0.9.1", default-features = false, features = ["sqlite-provider"] }
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "=1.9.1"
spake2 = "=0.4.0"
cpal = "=0.18.2"
sframe = "=2.0.0"
opus = "=0.4.0"
openh264 = "=0.9.8"
media = { package = "rtc-media", version = "=0.21.0" }
rtc = "=0.21.0"
webrtc = { version = "=0.21.0", default-features = false, features = ["crypto-ring", "runtime-tokio"] }
qrcodegen = "=1.8.0"
rqrr = "=0.10.1"
xcap = "=0.9.8"
nokhwa = { version = "=0.10.11", default-features = false, features = ["decoding", "input-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.11.1", default-features = false, features = ["tokio"] }
pipewire = "=0.10.1"

[build-dependencies]
prost-build = "=0.14.4"

[dev-dependencies]
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server"] }
