syntax = "proto3";

package slouching.v1;

// Authenticates possession of the device Ed25519 key. It grants no application
// authorization; each product route must still check its own membership rules.
message ClientHello {
  uint32 protocol_version = 1;
  bytes device_public_key = 2;
}

message ServerHello {
  uint32 protocol_version = 1;
  string server_role = 2;
  bool identity_available = 3;
  bool messaging_available = 4;
  bool calls_available = 5;
  bytes auth_nonce = 6;
}

message VersionError {
  uint32 supported_version = 1;
}

message AuthProof {
  bytes signature = 1;
}

message Authenticated {
  bytes device_public_key = 1;
  bool application_routes_available = 2;
}

message SfuCallJoin {
  bytes call_id = 1;
  bytes group_id = 2;
  uint64 epoch = 3;
  repeated bytes roster = 4;
  bytes roster_signature = 5;
}

message SfuCallOffer {
  bytes call_id = 1;
  bytes sdp = 2;
}

message SfuIceCandidate {
  bytes call_id = 1;
  string candidate = 2;
  string sdp_mid = 3;
  uint32 sdp_m_line_index = 4;
  string username_fragment = 5;
}

message SfuCallLeave {
  bytes call_id = 1;
}

message SfuCallJoined {
  bytes call_id = 1;
  repeated bytes roster = 2;
}

message SfuCallAnswer {
  bytes call_id = 1;
  bytes sdp = 2;
}

message SfuCallError {
  bytes call_id = 1;
  string code = 2;
  string message = 3;
}

message ClientFrame {
  oneof payload {
    ClientHello hello = 1;
    AuthProof auth_proof = 2;
    SfuCallJoin sfu_call_join = 3;
    SfuCallOffer sfu_call_offer = 4;
    SfuIceCandidate sfu_ice_candidate = 5;
    SfuCallLeave sfu_call_leave = 6;
  }
}

message ServerFrame {
  oneof payload {
    ServerHello hello = 1;
    VersionError version_error = 2;
    Authenticated authenticated = 3;
    SfuCallJoined sfu_call_joined = 4;
    SfuCallAnswer sfu_call_answer = 5;
    SfuIceCandidate sfu_ice_candidate = 6;
    SfuCallError sfu_call_error = 7;
  }
}
