syntax = "proto3";

package slouching.v1;

// Authenticates possession of the device Ed25519 key. It grants no application
// authorization; each product route must still check its own membership rules.
message ClientHello {
  uint32 protocol_version = 1;
  bytes device_public_key = 2;
}

message ServerHello {
  uint32 protocol_version = 1;
  string server_role = 2;
  bool identity_available = 3;
  bool messaging_available = 4;
  bool calls_available = 5;
  bytes auth_nonce = 6;
}

message VersionError {
  uint32 supported_version = 1;
}

message AuthProof {
  bytes signature = 1;
}

message Authenticated {
  bytes device_public_key = 1;
  bool application_routes_available = 2;
}

message ClientFrame {
  oneof payload {
    ClientHello hello = 1;
    AuthProof auth_proof = 2;
  }
}

message ServerFrame {
  oneof payload {
    ServerHello hello = 1;
    VersionError version_error = 2;
    Authenticated authenticated = 3;
  }
}
